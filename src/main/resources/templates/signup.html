<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員登録 - ポータル</title>
</head>
<body>
<main>
	<h1>会員登録</h1>

	<ul th:unless="${errors.isEmpty()}">
		<li th:each="message : ${errors}" th:text="${message}"></li>
	</ul>

	<form th:action="@{/signup}" method="post">
		<p><label>メールアドレス <input type="text" name="email" th:value="${email}" autocomplete="email"></label></p>
		<p><label>パスワード（8文字以上） <input type="password" name="password" autocomplete="new-password"></label></p>
		<p><label>ユーザー名（20文字まで） <input type="text" name="username" th:value="${username}"></label></p>
		<p><label>招待コード <input type="text" name="inviteCode" autocomplete="off"></label></p>
		<p><button type="submit">登録する</button></p>
	</form>

	<p><a th:href="@{/login}">ログイン</a> / <a th:href="@{/}">トップへ</a></p>
</main>
</body>
</html>
