<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ポータルの上部（受け入れ条件 5・10）。ログイン中だけユーザー名とログアウトのフォームを出す -->
<header th:fragment="header">
	<th:block th:if="${loginUsername != null}">
		<p th:text="|ログイン中: ${loginUsername}|">ログイン中: 山田</p>
		<p><a th:href="@{/settings/username}">ユーザー名の変更</a></p>
		<form th:action="@{/logout}" method="post">
			<button type="submit">ログアウト</button>
		</form>
	</th:block>
	<p th:if="${loginUsername == null}">
		<a th:href="@{/login}">ログイン</a>
		<a th:href="@{/signup}">会員登録</a>
	</p>
</header>
</body>
</html>
