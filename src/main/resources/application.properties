spring.application.name=ai-driven-portal

# 天気の地点（portal.weather.location.name / latitude / longitude）はここに書かない。
# 起動時に環境変数 PORTAL_WEATHER_LOCATION_* で渡す（無い・不正なら起動時に止まる）。
# 天気 API の接続先（portal.weather.api.base-url）の既定は https://api.open-meteo.com（WeatherProperties）。
# テスト用の時計（portal.test-clock.enabled）の既定は false（TestClockProperties）。

# ログは標準出力だけに出す（logging.file.* は設定しない）
